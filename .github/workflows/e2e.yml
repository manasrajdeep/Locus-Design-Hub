name: E2E

# Merges fail when any portal/admin sync, upload, realtime, retry, homepage CMS
# or tenant-isolation test breaks.
#
# Dependencies are installed with bun, matching bun.lock and the supply-chain
# guard in bunfig.toml. package-lock.json is stale and `npm ci` rejects it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      # Supabase config — set these as repository secrets/variables.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      # Public site origin used by canonical tags, the sitemap and robots.txt.
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      # Disposable Supabase project for the destructive specs (tenant-isolation
      # and superadmin-cms). They seed real users, projects, storage objects and
      # homepage content, so they must NOT point at the production project.
      # Without these three the destructive specs skip; the rest still run.
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
      E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium webkit

      - name: Run E2E suite
        run: bun run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  cwv:
    name: Core Web Vitals budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      # Point at the published/preview deploy to gate on production budgets.
      # Falls back to the dev server with the looser dev profile.
      BASE_URL: ${{ vars.CWV_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Lighthouse and scripts/cwv-check.mjs run on node.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start dev server (only when no deployed URL is configured)
        if: ${{ !vars.CWV_BASE_URL }}
        run: |
          bun run dev &
          bunx wait-on http://localhost:8080 --timeout 120000

      - name: Check LCP / CLS / TBT and image audits
        run: bun run test:cwv

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 7
